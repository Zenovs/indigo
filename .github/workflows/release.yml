# baut bei jedem tag "v*" die release-binaries und deb-pakete für x86_64 und
# aarch64 (raspberry pi u. a.) und veröffentlicht alles als github-release.
# der auto-updater im widget erwartet die assets exakt unter den namen
# "indigo-<arch>-linux" (arch wie rusts std::env::consts::ARCH: x86_64,
# aarch64) und "SHA256SUMS" — nicht umbenennen.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # schutz gegen endlos-update-schleifen: das release-tag muss zur
  # crate-version passen, sonst meldet sich das gebaute binary mit einer
  # anderen version als das tag und der updater dreht durch
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: tag == crate-version
        working-directory: app
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag="${GITHUB_REF_NAME#v}"
          test "$crate" = "$tag" || { echo "tag v$tag passt nicht zu Cargo.toml-version $crate" >&2; exit 1; }

  build:
    needs: version
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04 # ältere glibc für kompatibilität
          - arch: aarch64
            runner: ubuntu-22.04-arm # nativ statt cross: gtk braucht die arm64-dev-pakete
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: systemabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: build
        working-directory: app
        run: cargo build --release

      - name: deb-paket
        run: |
          cargo install cargo-deb
          (cd app && cargo deb)

      - name: artefakte vorbereiten
        run: |
          mkdir dist
          cp app/target/release/indigo dist/indigo-${{ matrix.arch }}-linux
          cp app/target/debian/indigo_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: indigo-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # eine SHA256SUMS über alle architekturen, dann erst veröffentlichen
  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: prüfsummen
        working-directory: dist
        run: sha256sum indigo-*-linux *.deb > SHA256SUMS

      - name: release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/indigo-*-linux
            dist/*.deb
            dist/SHA256SUMS
