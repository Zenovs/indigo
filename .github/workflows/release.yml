# baut bei jedem tag "v*" das release-binary und das deb-paket und
# veröffentlicht beides als github-release. der auto-updater im widget
# erwartet die assets exakt unter den namen "indigo-x86_64-linux" und
# "SHA256SUMS" — nicht umbenennen.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04 # ältere glibc für kompatibilität
    steps:
      - uses: actions/checkout@v4

      - name: systemabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # schutz gegen endlos-update-schleifen: das release-tag muss zur
      # crate-version passen, sonst meldet sich das gebaute binary mit einer
      # anderen version als das tag und der updater dreht durch
      - name: tag == crate-version
        working-directory: app
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag="${GITHUB_REF_NAME#v}"
          test "$crate" = "$tag" || { echo "tag v$tag passt nicht zu Cargo.toml-version $crate" >&2; exit 1; }

      - name: build
        working-directory: app
        run: cargo build --release

      - name: deb-paket
        run: |
          cargo install cargo-deb
          (cd app && cargo deb)

      - name: artefakte vorbereiten
        run: |
          cp app/target/release/indigo indigo-x86_64-linux
          cp app/target/debian/indigo_*_amd64.deb .
          sha256sum indigo-x86_64-linux *.deb > SHA256SUMS

      - name: release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            indigo-x86_64-linux
            *.deb
            SHA256SUMS
