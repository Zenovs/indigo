# build und tests bei jedem push auf main und bei pull requests, auf x86_64
# und aarch64 (raspberry pi u. a.).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: systemabhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: build
        working-directory: app
        run: cargo build

      - name: test
        working-directory: app
        run: cargo test
