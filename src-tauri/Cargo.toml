[package]
name = "indigo"
version = "0.1.0"
description = "desktop resource monitor widget"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
nvml-wrapper = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
